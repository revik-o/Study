<div class="table-container mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" class="full-width-table">

    <!-- Icon Column -->
    <ng-container matColumnDef="icon">
      <th mat-header-cell *matHeaderCellDef> Icon </th>
      <td mat-cell *matCellDef="let project">
        <mat-icon color="primary">{{project.icon}}</mat-icon>
      </td>
    </ng-container>

    <!-- Key Column -->
    <ng-container matColumnDef="key">
      <th mat-header-cell *matHeaderCellDef> Project Key </th>
      <td mat-cell *matCellDef="let project"> <strong>{{project.key}}</strong> </td>
    </ng-container>

    <!-- Issues Count Column -->
    <ng-container matColumnDef="issueCount">
      <th mat-header-cell *matHeaderCellDef> Count of Issues </th>
      <td mat-cell *matCellDef="let project"> {{project.issueCount}} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Manage </th>
      <td mat-cell *matCellDef="let project">
        <button mat-icon-button color="primary" (click)="openEditProjectModal($event, project)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="openDeleteProjectModal($event, project)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onRowClick(row)" class="clickable-row"></tr>
  </table>
</div>
