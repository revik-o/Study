<h2 mat-dialog-title>Edit Project</h2>
<mat-dialog-content>
  <form [formGroup]="projectForm" class="modal-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Project Key</mat-label>
      <input matInput formControlName="key" required>
      <mat-error *ngIf="projectForm.get('key')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Project Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="projectForm.get('name')?.hasError('required')">Required</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()">Save Changes</button>
</mat-dialog-actions>
