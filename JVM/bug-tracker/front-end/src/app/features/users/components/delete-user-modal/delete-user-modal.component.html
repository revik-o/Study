<h2 mat-dialog-title>Delete User</h2>
<mat-dialog-content>
  <p>Are you sure you want to delete user <strong>{{data.firstName}} {{data.lastName}}</strong>?</p>
  <p class="warning-text">This action cannot be undone.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="warn" (click)="onDelete()">Delete User</button>
</mat-dialog-actions>
