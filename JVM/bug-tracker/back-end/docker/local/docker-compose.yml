version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: bug_tracker_db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: root_password_bitch
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: bug_tracker_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - postgres
    network_mode: 'host'

volumes:
  pgdata:
