<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
</head>

<body>
    <h1>INTERFACE</h1>

    <button onclick="sendMessageToC()">Test</button>

    <script>
        function sendMessageToC() {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mySignal) {
                window.webkit.messageHandlers.mySignal.postMessage("TEST_BTN_CLICKED");
            }
        }
    </script>
</body>

</html>
